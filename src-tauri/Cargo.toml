[package]
name = "fcc-radio-study"
version = "1.3.0"
description = "Offline study program for the FCC Element 3, 8 and 9 commercial radio license exams"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small, fast portable .exe.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
