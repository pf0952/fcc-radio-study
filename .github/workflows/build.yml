name: Build

# Every push builds the portable .exe and uploads it as an artifact.
# Pushing a version tag (v1.0.0, ...) also attaches it to a GitHub Release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run check

      - run: npm test

      - run: npm run lessons

      - name: Build portable .exe
        run: npx tauri build --no-bundle

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Name the .exe
        run: Copy-Item src-tauri/target/release/fcc-radio-study.exe FCC-Radio-Study.exe

      - uses: actions/upload-artifact@v7
        with:
          name: FCC-Radio-Study
          path: FCC-Radio-Study.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME FCC-Radio-Study.exe --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME FCC-Radio-Study.exe --title "FCC Radio Study $env:GITHUB_REF_NAME" --generate-notes
          }
